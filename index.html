<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sistema Engenharia · Prometals</title>
<link rel="icon" href="comum/logo.png">
<link rel="stylesheet" href="comum/tema.css?v=1.0.0">
<style>
  .modulos{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
  .modulo{display:flex;flex-direction:column;gap:8px;padding:18px;background:var(--card);border:1px solid var(--linha);border-radius:12px;text-decoration:none;color:inherit;min-height:150px}
  a.modulo:hover{border-color:var(--lar)}
  .modulo .ic{width:26px;height:26px;color:var(--lar)}
  .modulo h3{margin:0;font-size:16px}
  .modulo p{margin:0;color:var(--mut);font-size:13px;flex:1}
  .modulo.bloq{opacity:.55}
  .modulo .rod{display:flex;gap:8px;flex-wrap:wrap}
</style>
</head>
<body>
<div id="app"><div class="vazio">Carregando…</div></div>
<script type="module" src="comum/inicio.js?v=1.4.0"></script>

</html>
